<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buttons</title>
</head>
<body>
    <a href="index.html" target="_blank">
    <button style="font-size: 25px;background-color: blue; border-radius: 100px;">
        Go to main site 
    </button>
    </a>
    <br>
    <br>
    <button onclick="dosome()" style="font-size: medium; background-color: red; border-radius: 10px;">Run javascript</button>
    <br>
    <p id="test">This text will change when you run javascript</p>
    <script>
        function dosome(){
            document.getElementById("test").innerHTML="U clicked the button";

        }
    </script>
</body>
</html>
